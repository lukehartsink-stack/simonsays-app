workflows:
  register-bundle-id:
    name: One-off · Register bundle ID in Apple Developer Portal
    max_build_duration: 15
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AutoBook ASC Admin
    environment:
      xcode: latest
    scripts:
      - name: Register coach.simonsays.app (no-op if it already exists)
        script: |
          if app-store-connect bundle-ids list --bundle-id-identifier coach.simonsays.app --strict-match-identifier --platform IOS | grep -q "coach.simonsays.app"; then
            echo "Bundle ID already registered."
          else
            app-store-connect bundle-ids create coach.simonsays.app \
              --name "simonsays coach" \
              --platform IOS
          fi
          app-store-connect bundle-ids list --bundle-id-identifier coach.simonsays.app --strict-match-identifier --platform IOS
      - name: Create App Store provisioning profile (if missing)
        script: |
          set -e
          BUNDLE_RES_ID=$(app-store-connect bundle-ids list --bundle-id-identifier coach.simonsays.app --strict-match-identifier --platform IOS --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d[0]["id"])')
          echo "Bundle ID resource: $BUNDLE_RES_ID"
          CERT_IDS=$(app-store-connect certificates list --type DISTRIBUTION --json \
            | python3 -c 'import json,sys; print(" ".join(c["id"] for c in json.load(sys.stdin)))')
          echo "Distribution certificates: $CERT_IDS"
          EXISTING=$(app-store-connect profiles list --bundle-id-resource-ids "$BUNDLE_RES_ID" --type IOS_APP_STORE --json 2>/dev/null \
            | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' || echo 0)
          if [ "$EXISTING" != "0" ]; then
            echo "App Store profile already exists ($EXISTING)."
          else
            app-store-connect profiles create "$BUNDLE_RES_ID" \
              --certificate-ids $CERT_IDS \
              --type IOS_APP_STORE \
              --name "simonsays coach App Store"
          fi

  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Name of the App Store Connect API key you add under
      # Codemagic → Teams → Integrations → Developer Portal
      app_store_connect: AutoBook ASC Admin
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: coach.simonsays.app
      vars:
        XCODE_PROJECT: "SimonSays.xcodeproj"
        XCODE_SCHEME: "SimonSays"
        # Numeric Apple ID of the app in App Store Connect (App Information → Apple ID)
        APP_STORE_APPLE_ID: 6806799514
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR"
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: Build ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Optional: auto-add to a beta group
        # beta_groups:
        #   - Internal testers
