workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Name of the App Store Connect API key you add under
      # Codemagic → Teams → Integrations → Developer Portal
      app_store_connect: AutoBook ASC Admin
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: coach.simonsays.app
      vars:
        XCODE_PROJECT: "SimonSays.xcodeproj"
        XCODE_SCHEME: "SimonSays"
        # Numeric Apple ID of the app in App Store Connect (App Information → Apple ID)
        APP_STORE_APPLE_ID: 0000000000
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR"
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: Build ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Optional: auto-add to a beta group
        # beta_groups:
        #   - Internal testers
