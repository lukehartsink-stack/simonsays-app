# XcodeGen spec — optional fallback if you prefer regenerating the project: `xcodegen generate`
name: SimonSays
options:
  bundleIdPrefix: coach.simonsays
  deploymentTarget:
    iOS: "17.0"
targets:
  SimonSays:
    type: application
    platform: iOS
    sources: [SimonSays]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: simonsays.coach
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: coach.simonsays.app
        TARGETED_DEVICE_FAMILY: "1,2"
